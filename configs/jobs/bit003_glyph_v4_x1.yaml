# BIT-003 · Brazo GLYPH v4 ×1 (experimento capacidad: ¿cabe el currículo de 4 años en 128d?)
#
#   red-pill job submit --recipe bit003_glyph_v4_x1
#
# Protocolo v3 (DL-011) con exam_repeat_factor=1: SIN drilling de examen.
# Hipótesis del operador (31-ago): con ×300/×10 el gate de hito se pasa por
# memorización (batería 80/50: vistas 70.7% vs no vistas 12%). Con ×1, si
# 128d no basta, el examen suspenderá → neurogénesis → la escalera se ejercita.
# Completa al superar el hito de 4 años (no corre hasta 8).

source: script_job
title: BIT-003 glyph v4 ×1 (sin drilling, hasta 4 años — test capacidad 128d)
priority: 5

step_command: .venv/bin/python -m src.bitnet.training.train_sovereign_school --adaptive --embedding glyph --amp bf16 --compile --require_gpu --full_tinystories --samples_per_epoch 400000 --wd_mode no_embed --exam_repeat_factor 1 --seed 42 --max_epochs_per_run 20 --state_dir storage/checkpoints/bit003_glyph_v4_x1
env:
  PYTHONPATH: .
  PYTHONUNBUFFERED: "1"
  # Anti-OOM: reduce la fragmentación del allocator (reserva sin ratchet)
  PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"

checkpoint_file: storage/checkpoints/bit003_glyph_v4_x1/school_state.json
pause_exit_code: 78

progress:
  mode: bounded
  current_key: current_epoch
  total: 800
  stage_current_key: current_stage_idx
  stage_total: 8
  stage_offset: 1
  stage_label: etapa

completion:
  key: milestones_achieved
  contains: 4_years

preflight:
  vram_unload: true
  min_free_vram_mb: 3500
  memory_max: 12G

control:
  max_step_minutes: 780
  preemptible: false
