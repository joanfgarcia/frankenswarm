# BIT-003 · Brazo GLYPH (control v1-inglés, DL-008/009).
#
#   red-pill job submit --recipe bit003_glyph
#
# Protocolo adaptativo DL-006, gateo de vocabulario por etapa (logit_mask),
# clasificación del corpus por gateo (umbral 95%), instrumento v2 (10
# preguntas/edad, solo in-vocab). corpus/currículo EN desde cero.
# state_dir propio: el trainer valida embedding_mode por directorio.
# --max_epochs_per_run 20: amortiza el torch.compile (~1-2 min/step).
# memory_max 24G: el json.load de la caché tokenizada (2.48 GB → ~18-20 GB
# de objetos Python) con el store CSR el proceso baja a ~2 GB (antes ~20 GB); 12G es margen holgado.

source: script_job
title: BIT-003 glyph (v1-inglés, corpus completo, gateo DL-008)
priority: 5

step_command: .venv/bin/python -m src.bitnet.training.train_sovereign_school --adaptive --embedding glyph --amp bf16 --compile --require_gpu --full_tinystories --samples_per_epoch 400000 --wd_mode no_embed --exam_repeat_factor 10 --seed 42 --max_epochs_per_run 20 --state_dir storage/checkpoints/bit003_glyph
env:
  PYTHONPATH: .
  PYTHONUNBUFFERED: "1"
  # Reduce la fragmentacion del allocator (reserva sin ratchet; sugerido por el propio OOM del 31-ago)
  PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"

checkpoint_file: storage/checkpoints/bit003_glyph/school_state.json
pause_exit_code: 78

progress:
  mode: bounded
  current_key: current_epoch
  total: 1600              # máximo teórico del protocolo adaptativo (8×200)
  stage_current_key: current_stage_idx
  stage_total: 8
  stage_offset: 1
  stage_label: etapa

completion:
  key: milestones_achieved
  contains: 8_years

preflight:
  vram_unload: true
  min_free_vram_mb: 3500   # si el sueño ocupa la GPU, el job se difiere solo
  memory_max: 12G

control:
  max_step_minutes: 780
  preemptible: false
