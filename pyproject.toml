[project]
name = "frankenswarm"
version = "0.3.1"
description = "Heterogeneous Hardware MoE"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyswip",
    "numpy",
    "torch",
    "fastembed"
]

[project.optional-dependencies]
opt8bit = [
    "bitsandbytes>=0.44.0"
]
dev = [
    "ruff",
    "pytest"
]

[tool.ruff]
line-length = 150
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM"]
ignore = ["E501", "W191"]

[tool.ruff.format]
indent-style = "tab"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

