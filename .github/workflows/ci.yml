name: Frankenswarm CI

on:
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install system deps (swipl)
      run: sudo apt-get update -qq && sudo apt-get install -y -qq swi-prolog

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true

    - name: Install dependencies
      run: uv sync --extra dev

    - name: Lint (ruff — warn, no bloquea por deuda preexistente)
      run: uv run ruff check --exit-zero src/ scripts/ tests/

    - name: Run tests (CPU only, skip GPU)
      run: uv run pytest -q -k "not (gpu or cuda or bf16 or benchmark)" tests/
