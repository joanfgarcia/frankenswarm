name: Frankenswarm CI

on:
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true

    - name: Install dependencies
      run: uv sync --extra dev

    - name: Lint (ruff)
      run: uv run ruff check src/ scripts/ tests/

    - name: Run tests (CPU only)
      run: uv run pytest -q -k "not (gpu or cuda or bf16 or benchmark)" tests/
